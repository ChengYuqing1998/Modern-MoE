# nanoGPTMoE-v3: wide shared backbone with standard MHA and tied embeddings.
# Every layer uses standard RoPE causal full attention. There is no KDA or
# other linear attention.
architecture_name: nanoGPTMoE-v3
vocab_size: 151936
tokenizer_path: tokenizer/qwen3_moe
hidden_size: 1024
num_hidden_layers: 16

# Standard MHA with the conventional 64-dimensional attention heads.
num_attention_heads: 16
num_key_value_heads: 16

# Layer 0 is dense. 1024 * 8/3 is rounded up to the standard multiple of 256.
use_moe: true
first_k_dense_replace: 1
dense_intermediate_size: 2816

# Layers 1-15 use Top-4 routed experts plus two always-active shared experts.
intermediate_size: 768
num_experts: 12
num_experts_per_tok: 4
num_shared_experts: 2

max_position_embeddings: 2048
rope_theta: 10000.0
attention_pattern: [full]
full_attention_backend: flash_attn
attention_dropout: 0.0
residual_dropout: 0.0
rms_norm_eps: 1.0e-6

router_aux_loss_coef: 0.01
router_z_loss_coef: 0.001
num_mtp_layers: 0
mtp_loss_coef: 0.0
tie_word_embeddings: true
initializer_range: 0.02
