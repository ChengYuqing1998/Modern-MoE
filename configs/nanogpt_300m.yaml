# nanoGPT: dense decoder-only Transformer, approximately 300M parameters.
# No MoE, router, shared expert, linear attention, MLA, KDA, GLA, or MTP.
#
# Exact parameter count with tied token embedding / LM head:
#   300,737,280
vocab_size: 151936
tokenizer_path: tokenizer/qwen3_moe
hidden_size: 768
num_hidden_layers: 16

# Standard MHA: every query head has its own key/value head.
num_attention_heads: 12
num_key_value_heads: 12

# One dense SwiGLU FFN in every decoder layer.
use_moe: false
intermediate_size: 3968

max_position_embeddings: 2048
rope_theta: 10000.0
attention_pattern: [full]
full_attention_backend: flash_attn
attention_dropout: 0.0
residual_dropout: 0.0

# Strict Pre-RMSNorm and standard attention/FFN residual paths.
rms_norm_eps: 1.0e-6
router_aux_loss_coef: 0.0
router_z_loss_coef: 0.0
num_mtp_layers: 0
mtp_loss_coef: 0.0
tie_word_embeddings: true
initializer_range: 0.02
