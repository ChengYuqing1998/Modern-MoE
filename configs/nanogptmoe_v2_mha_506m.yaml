# nanoGPTMoE-v2-MHA: the MHA comparison for nanoGPTMoE-v2.
# Every layer uses standard full causal attention; there is no KDA or other
# linear attention.
architecture_name: nanoGPTMoE-v2-MHA
vocab_size: 151936
tokenizer_path: tokenizer/qwen3_moe
hidden_size: 512
num_hidden_layers: 16

# Standard MHA: every query head has its own key/value head.
num_attention_heads: 8
num_key_value_heads: 8

# Layer 0 is dense; layers 1-15 are sparse MoE.
use_moe: true
first_k_dense_replace: 1
dense_intermediate_size: 2048
intermediate_size: 1024
num_experts: 12
num_experts_per_tok: 3
num_shared_experts: 2

max_position_embeddings: 2048
rope_theta: 10000.0

# Repeated for all 16 layers: standard RoPE causal full attention only.
attention_pattern: [full]
full_attention_backend: flash_attn
attention_dropout: 0.0
residual_dropout: 0.0
rms_norm_eps: 1.0e-6

router_aux_loss_coef: 0.01
router_z_loss_coef: 0.001
num_mtp_layers: 0
mtp_loss_coef: 0.0
tie_word_embeddings: false
initializer_range: 0.02
