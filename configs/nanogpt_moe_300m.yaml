# nanoGPT-style sparse MoE: standard full causal self-attention only.
# No KDA, GLA, MLA, or other linear-attention layer is used.
#
# Parameter count with tied token embedding / LM head:
#   total: 300,073,472
vocab_size: 151936
tokenizer_path: tokenizer/qwen3_moe
hidden_size: 512
num_hidden_layers: 16

# Standard multi-head attention (MHA): every query head has its own K/V head.
num_attention_heads: 8
num_key_value_heads: 8

# Fine-grained SwiGLU MoE: top-2 routed experts plus one shared expert.
intermediate_size: 288
num_experts: 28
num_experts_per_tok: 2
num_shared_experts: 1

max_position_embeddings: 2048
rope_theta: 10000.0

# A one-entry pattern repeats across all 16 layers, so every layer is full
# causal attention. RoPE is applied to the complete Q/K head dimension.
attention_pattern: [full]
full_attention_backend: flash_attn
attention_dropout: 0.0
residual_dropout: 0.0

# DecoderLayer uses strict Pre-RMSNorm and standard attention/FFN residuals.
rms_norm_eps: 1.0e-6
router_aux_loss_coef: 0.01
router_z_loss_coef: 0.001

# Keep the architecture nanoGPT-like: no MTP auxiliary decoder.
num_mtp_layers: 0
mtp_loss_coef: 0.0
tie_word_embeddings: true
initializer_range: 0.02
