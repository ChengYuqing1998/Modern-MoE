# nanoGPT Untied: same dense architecture as nanoGPT 300M, but token
# embeddings and the LM head use separate parameter matrices.
#
# Exact parameter count:
#   tied nanoGPT:       300,737,280
#   extra untied head:  116,686,848
#   total:              417,424,128
vocab_size: 151936
tokenizer_path: tokenizer/qwen3_moe
hidden_size: 768
num_hidden_layers: 16

num_attention_heads: 12
num_key_value_heads: 12

use_moe: false
intermediate_size: 3968

max_position_embeddings: 2048
rope_theta: 10000.0
attention_pattern: [full]
full_attention_backend: flash_attn
attention_dropout: 0.0
residual_dropout: 0.0

rms_norm_eps: 1.0e-6
router_aux_loss_coef: 0.0
router_z_loss_coef: 0.0
num_mtp_layers: 0
mtp_loss_coef: 0.0
tie_word_embeddings: false
initializer_range: 0.02
