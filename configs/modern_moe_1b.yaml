# Approximately 1.113B total parameters with the Qwen3 MoE vocabulary.
# The routed+shared FFN path selects about
# 283M expert parameters/token across all layers (roughly 460M active weights
# when embeddings and attention projections are also counted).
# Official Qwen3 MoE embedding size. The tokenizer currently defines 151,669
# IDs; Qwen pads the model vocabulary matrix to 151,936 rows.
vocab_size: 151936
tokenizer_path: tokenizer/qwen3_moe
hidden_size: 1024
num_hidden_layers: 20
num_attention_heads: 16
num_key_value_heads: 4
intermediate_size: 1536

# Fine-grained MoE: top-2 routed experts and one always-on shared expert.
num_experts: 8
num_experts_per_tok: 2
num_shared_experts: 1

max_position_embeddings: 8192
rope_theta: 500000.0

# Repeats across depth: 3 KDA-style linear layers, then 1 full-attention layer.
attention_pattern: [linear, linear, linear, full]
full_attention_backend: eager
attention_dropout: 0.0
residual_dropout: 0.0
rms_norm_eps: 1.0e-6

router_aux_loss_coef: 0.01
router_z_loss_coef: 0.001
tie_word_embeddings: true
initializer_range: 0.02
