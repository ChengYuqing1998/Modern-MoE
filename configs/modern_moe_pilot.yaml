# Small MoE configuration for Qwen3-tokenized pretraining.
# Exact count with one sequential MTP layer:
#   total parameters: 322,250,152
#   main + MTP active-route parameters: 121,709,992
vocab_size: 151936
tokenizer_path: tokenizer/qwen3_moe
hidden_size: 512
num_hidden_layers: 16
num_attention_heads: 8
num_key_value_heads: 2
intermediate_size: 384

# Fine-grained top-2 routing. More small experts provide capacity while keeping
# the per-token path close to 50M. This pilot omits the always-on shared expert.
num_experts: 22
num_experts_per_tok: 2
num_shared_experts: 0

max_position_embeddings: 2048
rope_theta: 100000.0
attention_pattern: [linear, linear, linear, full]
full_attention_backend: flash_attn
attention_dropout: 0.0
residual_dropout: 0.0
rms_norm_eps: 1.0e-6
router_aux_loss_coef: 0.01
router_z_loss_coef: 0.001
num_mtp_layers: 1
mtp_loss_coef: 0.1
tie_word_embeddings: true
initializer_range: 0.02
